# Brute-force protection on authentication: 5 req/s per IP with a small burst.
# Applied only to the login/register endpoints so normal API use is unaffected.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the API's MAX_UPLOAD_SIZE_MB (25MB) or nginx 413s before FastAPI sees the upload
    client_max_body_size 30m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rate-limit the auth endpoints (login, register, forgot-password) against brute force.
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Transcription / LLM calls can run for minutes (multi-page PDFs, long text).
        # Must be >= the gunicorn --timeout in backend/startup.sh.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Expose the backend's interactive API docs at this origin (Swagger/ReDoc).
    # These are FastAPI routes on the api service, not SPA routes.
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
